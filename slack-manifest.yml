# Paste this into https://api.slack.com/apps → Create New App → From a manifest.
# The Railway URL is already filled in below.
display_information:
  name: Block Bot
  description: Pauses notifications during team quiet blocks and holds messages until they end.
  background_color: "#2c2d30"
features:
  bot_user:
    display_name: Block Bot
    always_online: true
oauth_config:
  redirect_urls:
    - https://slack-block-bot-production.up.railway.app/slack/oauth_redirect
  scopes:
    bot:
      - chat:write
      - im:write
      - users:read
    user:
      - chat:write
      - dnd:write
      - users.profile:write
      - channels:history
      - groups:history
      - im:history
      - mpim:history
settings:
  event_subscriptions:
    request_url: https://slack-block-bot-production.up.railway.app/slack/events
    user_events:
      - message.channels
      - message.groups
      - message.im
      - message.mpim
    bot_events:
      - tokens_revoked
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
